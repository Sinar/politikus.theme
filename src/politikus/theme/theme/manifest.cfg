[theme]
title = Plone Theme: Politikus theme
description = Diazo theme for the Plone 6.2 Classic UI
preview = preview.png
rules = ++theme++politikus-theme/rules.xml
prefix = /++theme++politikus-theme
doctype = <!DOCTYPE html>

enabled-bundles =
disabled-bundles =

# css/theme.css is the Plone 6.2 barceloneta stylesheet followed by the
# Politikus custom styles at the bottom of the file.  Roboto fonts are
# served from the sibling roboto/ directory (relative ../roboto/ urls,
# same layout as plonetheme.barceloneta).
development-css = ++theme++politikus-theme/css/theme.css
production-css = ++theme++politikus-theme/css/theme.css
tinymce-content-css = ++theme++politikus-theme/css/theme.css

[theme:parameters]
ajax_load = python:request.get('ajax_load')
portal_url = portal_state/portal_url
